name: typescript

on:
  pull_request:
    paths:
      - typescript/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/typescript.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
        working-directory: typescript

      - run: pnpm run typecheck
        working-directory: typescript

      - run: pnpm run build
        working-directory: typescript

      - run: pnpm test
        working-directory: typescript

      - name: Verify native dev execution (node --watch)
        working-directory: typescript
        run: |
          OUTPUT=$(timeout 5 pnpm run dev || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "bar"
