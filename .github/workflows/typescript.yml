name: typescript

on:
  pull_request:
    paths:
      - typescript/**
      - .github/workflows/typescript.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: typescript

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm test

      - name: Verify native dev execution (node --watch)
        run: |
          OUTPUT=$(timeout 5 pnpm run dev || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "bar"
